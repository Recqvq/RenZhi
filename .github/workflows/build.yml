name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Offline tests
        run: ./test.sh
      - name: Universal macOS build
        run: ./build.sh
      - name: Check release hygiene
        run: python3 Scripts/audit.py
      - name: Package and verify
        run: |
          ./package.sh
          hdiutil verify dist/RenZhi-*.dmg
          cd dist
          shasum -a 256 -c SHA256SUMS
      - name: Save distributables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RenZhi-macOS
          path: |
            dist/RenZhi-*.dmg
            dist/RenZhi-*-macOS.zip
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: RenZhi-macOS
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS
          cd ..
          gh release create "$RELEASE_TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "RenZhi $RELEASE_TAG" --notes-file docs/RELEASE.md
